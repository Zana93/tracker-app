<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6c4cf1">
<title>چاودێری بازاڕ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root{--bg:#eef0fa;--panel:#fff;--ink:#1f1d3a;--muted:#77759a;--accent:#6c4cf1;--line:#e3e2f2}
  @media (prefers-color-scheme:dark){:root{--bg:#15142a;--panel:#1f1d3a;--ink:#f1f0ff;--muted:#a4a2c8;--line:#34325a}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px}
  .box{width:100%;max-width:420px;background:var(--panel);border-radius:22px;padding:26px;box-shadow:0 10px 30px rgba(60,50,140,.12)}
  h1{font-size:22px;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 16px;font-size:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .err{color:#d93a5b;font-size:14px;margin-top:10px;min-height:1em}
  .spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:s 1s linear infinite;margin:0 auto}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div></div>
<script>
// Public loader: holds no data and no program. After sign-in it loads the real dashboard
// from your PRIVATE repo with your token, so nothing about what you track is public.
const K = 'mt.conn', CACHE = 'mt.shell';
const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const box = document.getElementById('box');

function form(msg) {
  const c = get(K) || {}, e = x => String(x || '').replace(/[&<>"]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[m]));
  box.innerHTML = `<h1>📊 چاودێری بازاڕ</h1><p>بە GitHub پەیوەست ببە.</p>
    <label>GitHub username</label><input id="o" dir="ltr" value="${e(c.owner)}">
    <label>Repo</label><input id="r" dir="ltr" value="${e(c.repo)}">
    <label>Token</label><input id="t" type="password" dir="ltr" placeholder="github_pat_…">
    <label>ڕۆڵ</label><select id="l"><option value="admin">ئادمین</option><option value="viewer" ${c.role === 'viewer' ? 'selected' : ''}>کارمەند (تەنها بینین)</option></select>
    <button id="go">پەیوەستبوون</button><div class="err">${msg || ''}</div>`;
  document.getElementById('go').onclick = () => {
    const $ = id => document.getElementById(id);
    const v = {owner: $('o').value.trim(), repo: $('r').value.trim(), branch: 'main', token: $('t').value.trim(), role: $('l').value};
    if (!v.owner || !v.repo || !v.token) return;
    set(K, v); start();
  };
}
function show(html) { document.open(); document.write(html); document.close(); }
async function start() {
  const c = get(K);
  if (!c || !c.token) return form();
  box.innerHTML = '<div class="spin"></div>';
  try {
    const res = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/dashboard/index.html?ref=${c.branch || 'main'}&t=${Date.now()}`,
      {headers: {Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28'}, cache: 'no-store'});
    if (res.status === 401 || res.status === 403 || res.status === 404) { return form('Token یان username/Repo هەڵەیە (' + res.status + ')'); }
    if (!res.ok) throw new Error(res.status);
    const html = await res.text();
    try { localStorage.setItem(CACHE, html); } catch {}
    show(html);
  } catch (e) {
    const old = localStorage.getItem(CACHE);
    if (old) show(old); else form('ئینتەرنێت نییە، یان GitHub وەڵام ناداتەوە.');
  }
}
start();
</script>
</body>
</html>

<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6c4cf1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="چاودێری بازاڕ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>چاودێری بازاڕ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== tokens: soft lavender, violet gradient, pink highlight ===== */
:root{
  --paper:#eef0fa; --panel:#ffffff; --ink:#27224a; --muted:#8a87a6; --line:#e9e7f5; --rule:#f1f0f9;
  --accent:#6c4cf1; --accent2:#a48bff; --accent-soft:#f0ecff; --pink:#ff5c8a; --pink-soft:#ffe9ef;
  --blue:#6c4cf1; --blue-soft:#f3f0ff; --good:#16a36a; --good-soft:#e4f7ee; --warn:#e5484d; --warn-soft:#fdecec;
  --bar:#6c4cf1; --bar2:#e3ddfb; --gold:#ff5c8a;
  --shadow:0 8px 28px rgba(88,64,200,.08);
  --r:20px;
  --f-body:"Poppins","Noto Sans Arabic","Segoe UI",Tahoma,"DejaVu Sans",sans-serif;
  --f-head:"Noto Kufi Arabic","Poppins","Noto Sans Arabic",Tahoma,"DejaVu Sans",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#13112a; --panel:#1c1938; --ink:#ecebfa; --muted:#9d9abd; --line:#2b2750; --rule:#24213f;
  --accent:#8b70ff; --accent2:#b9a6ff; --accent-soft:#2a2357; --pink:#ff7aa0; --pink-soft:#3b1f33;
  --blue:#a48bff; --blue-soft:#251f4c; --good:#4fd39a; --good-soft:#163428; --warn:#ff7a7e; --warn-soft:#3d1d24;
  --bar:#8b70ff; --bar2:#2e2958; --gold:#ff7aa0; --shadow:none;
}}
:root[data-theme="dark"]{
  --paper:#13112a; --panel:#1c1938; --ink:#ecebfa; --muted:#9d9abd; --line:#2b2750; --rule:#24213f;
  --accent:#8b70ff; --accent2:#b9a6ff; --accent-soft:#2a2357; --pink:#ff7aa0; --pink-soft:#3b1f33;
  --blue:#a48bff; --blue-soft:#251f4c; --good:#4fd39a; --good-soft:#163428; --warn:#ff7a7e; --warn-soft:#3d1d24;
  --bar:#8b70ff; --bar2:#2e2958; --gold:#ff7aa0; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;background:var(--paper)}
.num,td.n,.kpi b,.tile b{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head)}

/* ===== layout: floating violet rail + page ===== */
.rail{position:fixed;inset-block:16px;inset-inline-start:16px;width:220px;border-radius:26px;background:linear-gradient(165deg,#8467ff 0%,#6c4cf1 45%,#5236d1 100%);color:rgba(255,255,255,.78);display:flex;flex-direction:column;padding:22px 12px;z-index:6;box-shadow:0 18px 40px rgba(92,64,220,.28)}
.brand{font-family:var(--f-head);font-weight:800;font-size:17px;color:#fff;display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.brand i{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-style:normal;font-size:16px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:rgba(255,255,255,.78);padding:10px 12px;border-radius:14px;cursor:pointer;text-align:start;font-size:14.5px;white-space:nowrap}
nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:rgba(255,255,255,.1);color:#fff}
nav button.on{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.rail-foot{margin-top:auto;padding:12px 8px 0;display:grid;gap:8px}
.rail-foot select{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:12px;padding:7px 10px}
.rail-foot select option{color:#000}
.page{margin-inline-start:252px;min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px)}
.top-in{max-width:1260px;margin:auto;display:flex;align-items:center;gap:14px;padding:18px 24px 10px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;font-weight:800;flex:1}
main{max-width:1260px;margin:auto;padding:10px 24px 80px}
@media (max-width:900px){
  .rail{inset:auto 0 0 0;width:auto;height:66px;flex-direction:row;padding:0 6px;border-radius:22px 22px 0 0;overflow-x:auto}
  .brand,.rail-foot{display:none}
  nav{flex-direction:row;gap:0;width:100%}
  nav button{flex-direction:column;gap:2px;padding:8px 10px;font-size:11px;flex:1;min-width:70px;justify-content:center;border-radius:12px;margin:6px 2px}
  .page{margin:0;padding-bottom:66px}
  .top-in{padding:14px 16px 8px}
  .top h1{font-size:20px}
  main{padding:8px 16px 90px}
  .mobile-only{display:inline-block!important}
}
.mobile-only{display:none!important}
.spacer{flex:1}
select,input[type=text],input[type=password],input[type=number],input[type=url],input[type=date],textarea{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px;min-width:0}

/* ===== cards ===== */
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.mt{margin-top:18px}
.card{background:var(--panel);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12.5px}
.card h3 .right{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpi span{color:var(--muted);font-size:13px;display:block}
.kpi b{display:block;font-family:"Poppins",var(--f-body);font-size:28px;font-weight:600;line-height:1.25;text-align:right;margin:4px 0 2px}
.kpi em{font-style:normal;color:var(--muted);font-size:13px}
.kpi.good{background:linear-gradient(150deg,#8467ff,#5a3fe0);color:#fff}
.kpi.good span,.kpi.good em{color:rgba(255,255,255,.8)}
.kpi.good b{color:#fff;font-size:34px}
[dir=ltr] .kpi b,[dir=ltr] .tile b{text-align:left}

/* icon tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:18px}
.tile{background:var(--panel);border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);min-width:0}
.tile .ic{width:48px;height:48px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile span{color:var(--muted);font-size:13px;display:block}
.tile b{display:block;font-family:"Poppins",var(--f-body);font-size:24px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile em{font-style:normal;color:var(--muted);font-size:12px}
.tile>div{min-width:0}
.tile.hero{background:linear-gradient(150deg,#8467ff,#5a3fe0);color:#fff}
.tile.hero .ic{background:rgba(255,255,255,.2);color:#fff}
.tile.hero span,.tile.hero em{color:rgba(255,255,255,.82)}

/* reports explorer */
.rep-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:14px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--rule);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.chip:hover{background:var(--accent-soft)}
.chip.on{background:var(--accent);color:#fff;font-weight:600}
.rep-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper b{min-width:120px;text-align:center;font-size:14px}
.stepper .btn{font-size:20px;line-height:1;padding:2px 12px 5px}
.crumbs{margin:16px 4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.crumbs a{text-decoration:none}
.crumbs .sep{color:var(--muted)}
h2.sec{font-size:17px;margin:26px 4px 12px;display:flex;gap:8px;align-items:baseline}
h2.sec small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.scard{border:0;background:var(--panel);border-radius:var(--r);padding:18px;text-align:start;cursor:pointer;box-shadow:var(--shadow);display:grid;gap:6px}
.scard:hover{outline:2px solid var(--accent-soft)}
.ic.big{width:52px;height:52px;border-radius:16px;background:linear-gradient(150deg,#8467ff,#5a3fe0);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.nm{font-weight:600;font-size:15.5px}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.kpi2 span{display:block;color:var(--muted);font-size:12px}
.kpi2 b{font-size:18px;direction:ltr;unicode-bidi:isolate}
.prog{height:7px;background:var(--rule);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
[dir=rtl] .prog i{margin-inline-start:0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.ccard{border:0;background:var(--panel);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);text-align:start;display:flex;flex-direction:column}
.ccard:hover{outline:2px solid var(--accent-soft)}
.ccard img,.ccard .ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff;display:grid;place-items:center}
.ccard .ph,.pimg .ph{background:linear-gradient(150deg,var(--accent-soft),var(--pink-soft));color:var(--accent);font-size:34px;font-weight:700}
.cbody{padding:12px 14px 14px;display:grid;gap:2px}
.cbody .muted{font-size:12.5px}
.cu{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.cu b{font-size:20px}
.cu span{color:var(--muted);font-size:12px}
.chart-card .chart{max-height:290px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.pcard:hover{border-color:var(--accent2)}
.pimg{position:relative;aspect-ratio:1/1;background:#fff}
.pimg img,.pimg .ph{width:100%;height:100%;object-fit:contain;display:grid;place-items:center}
.medal{position:absolute;top:8px;inset-inline-start:8px;font-size:22px}
.pill.so{position:absolute;bottom:8px;inset-inline-end:8px}
.pbody{padding:12px;display:grid;gap:4px}
.sm{font-size:12.5px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px;background:var(--rule);border-radius:12px;padding:6px}
.pstats div{text-align:center}
.pstats span{display:block;font-size:10.5px;color:var(--muted)}
.pstats b{font-size:14px;font-variant-numeric:tabular-nums}
.pstats .hl{background:var(--accent);border-radius:9px;color:#fff}
.pstats .hl span{color:rgba(255,255,255,.85)}

/* tiers, dates, month comparison */
.tier{display:inline-block;justify-self:start;width:max-content;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;margin-top:2px;white-space:nowrap}
.tier.gold{background:linear-gradient(135deg,#fff3c4,#ffd86b);color:#7a5200}
.tier.silver{background:linear-gradient(135deg,#f2f4f8,#d4d9e3);color:#4a5265}
.tier.bronze{background:linear-gradient(135deg,#fbe3d2,#e9b48e);color:#7a3d14}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.dates div{background:var(--rule);border-radius:14px;padding:10px 12px}
.dates .out{background:var(--warn-soft)}
.dates .back{background:var(--good-soft)}
.dates>div>span{display:block;font-size:12px;color:var(--muted)}
.dates b{font-size:16px}
.dates em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.mom{display:grid;gap:10px}
.momrow{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.2fr;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--rule)}
.momrow.better{background:linear-gradient(90deg,var(--good-soft),var(--rule))}
.momrow.worse{background:linear-gradient(90deg,var(--warn-soft),var(--rule))}
.momrow span{display:block;font-size:12px;color:var(--muted)}
.momrow b{font-size:18px}
.momrow em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.momrow .verdict{text-align:end}
.momrow .verdict .pill{font-size:14px;padding:3px 12px}
@media (max-width:600px){.momrow{grid-template-columns:1fr 1fr}.momrow .verdict{text-align:start}}
tr.sel td{background:var(--accent-soft)}
/* site branding */
.slogo{display:inline-grid;place-items:center;flex:none;max-width:160px;background:#fff;border-radius:12px;padding:3px 6px;border:1px solid var(--line);vertical-align:middle}
.slogo img{height:100%;max-width:150px;object-fit:contain}
.slogo b{display:none;font-size:15px;color:var(--accent)}
.slogo.fail{background:var(--accent-soft);padding:0 10px;border:0;aspect-ratio:1}
.slogo.fail b{display:block}
.chip .slogo{border-radius:7px;padding:1px 4px;margin-inline-end:6px}
.chip{display:inline-flex;align-items:center}
.sitehead{margin-top:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 22px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);border-top:5px solid var(--brand)}
.sh-logo .slogo{border-radius:16px;padding:6px 12px}
.sh-main{flex:1;min-width:160px;display:grid}
.sh-name{font-family:var(--f-head);font-size:22px}
.sh-url{font-size:13px;text-decoration:none;color:var(--muted);direction:ltr;text-align:start}
.sh-stats{display:flex;gap:10px}
.sh-stats div{background:var(--rule);border-radius:14px;padding:8px 14px;text-align:center;min-width:80px}
.sh-stats span{display:block;font-size:12px;color:var(--muted)}
.sh-stats b{font-size:18px}
.scard .slogo{justify-self:start}
.cic{display:grid;place-items:center;width:64px;height:64px;margin:18px auto 4px;border-radius:20px;font-size:32px;background:linear-gradient(150deg,var(--accent-soft),var(--pink-soft))}
.cic.sm{display:inline-grid;width:32px;height:32px;margin:0;border-radius:10px;font-size:17px}
.ccard{align-items:stretch}
.ccard .cbody{text-align:center}
.ccard .cu{justify-content:center}
.pact{display:flex;gap:6px;margin-top:8px}
.pact .btn{flex:1;text-align:center;text-decoration:none;font-size:12px;padding:5px 6px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.gray{background:var(--rule);color:var(--muted)}
.pill.gold{background:var(--pink-soft);color:var(--pink)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:9px 6px;border-top:1px solid var(--rule);cursor:pointer;border-radius:12px}
.list li:hover{background:var(--blue-soft)}
.list li:first-child{border-top:0}
.rank{width:22px;color:var(--muted);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:15px;overflow:hidden}
img.thumb{background:#fff;border:1px solid var(--line)}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
[dir=ltr] .ell{text-align:left}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--line);vertical-align:middle;margin-inline:4px}
.seg{display:inline-flex;border-radius:12px;padding:3px;background:var(--rule)}
.seg button{border:0;background:none;border-radius:9px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}

table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-top:1px solid var(--rule);text-align:start;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12.5px;border-top:0;white-space:nowrap}
th[data-k]{cursor:pointer;user-select:none}
th[data-k]:hover{color:var(--ink)}
td.n,.endcol{text-align:end}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--blue-soft)}
.scroll{overflow-x:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
svg text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block}
.empty{padding:32px;text-align:center;color:var(--muted)}
.banner{border-radius:16px;padding:12px 16px;margin-bottom:16px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft)}
dialog{border:0;border-radius:24px;padding:0;max-width:820px;width:calc(100% - 32px);background:var(--panel);color:var(--ink);box-shadow:0 28px 70px rgba(40,24,120,.35)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(25,18,60,.5)}
.dlg{padding:24px}
.dlg-head{display:flex;gap:16px;align-items:flex-start}
.dlg-head .thumb{width:96px;height:96px;border-radius:18px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.kv div{background:var(--rule);border-radius:14px;padding:10px 12px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:18px;font-weight:600}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select{color:var(--ink)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media (max-width:900px){.toast{bottom:84px}}
.login{max-width:520px;margin:40px auto}
.login ol{padding-inline-start:18px;color:var(--muted);font-size:14px}
.hide{display:none!important}
.star{border:0;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--muted)}
.star.on{color:var(--pink)}
.heat td{text-align:center;font-size:13px}
.up{color:var(--good)} .down{color:var(--warn)}
textarea{width:100%;min-height:70px;resize:vertical}

/* ---------- pricing & profit ---------- */
function renderPricing() {
  if (!mineIds().length) { $('#main').innerHTML = topBanner() + `<div class="card empty">سایتەکەی خۆت هێشتا داتای نییە.<br>لە <b>ئادمین</b>، "سایتی منە" لەسەر سایتەکەت دابنێ و ڕێنمایی (recipe)ـی بۆ هەڵبژێرە.${isAdmin() ? '<br><br><button class="btn primary" onclick="S.view=\'admin\';render()">بڕۆ بۆ ئادمین</button>' : ''}</div>`; return; }
  const {pairs} = computeMatches();
  const target = (S.settings.targetMargin ?? 25) / 100;
  const byMine = new Map();
  for (const p of pairs) { const k = ID(p.a); if (!byMine.has(k)) byMine.set(k, {a: p.a, rivals: []}); byMine.get(k).rivals.push(p); }
  const rows = [...byMine.values()].map(({a, rivals}) => {
    const cur = a.currency || 'USD';
    const mine = toUSD(a.price, cur);
    const rp = rivals.map(r => toUSD(r.b.price, r.b.currency)).filter(v => v != null).sort((x, y) => x - y);
    const min = rp[0] ?? null, med = rp.length ? rp[Math.floor(rp.length / 2)] : null;
    const costLocal = S.costs[ID(a)], cost = costLocal != null ? toUSD(costLocal, cur) : null;
    const margin = cost != null && mine ? (mine - cost) / mine : null;
    let sug = med != null ? med * 0.98 : null;
    if (cost != null) { const floor = cost / (1 - target); sug = sug == null ? floor : Math.max(sug, floor); }
    const diff = mine && min ? (min - mine) / mine * 100 : null;
    let sugLocal = roundPrice(fromUSD(sug, cur), cur);
    if (costLocal != null && sugLocal != null) { const floorLocal = costLocal / (1 - target); if (sugLocal < floorLocal) sugLocal = cur === 'IQD' ? Math.ceil(floorLocal / 250) * 250 : Math.ceil(floorLocal * 100) / 100; }
    return {a, rivals, cur, mine, min, med, cost, margin, sug, sugLocal, diff};
  }).sort((x, y) => (x.diff ?? 999) - (y.diff ?? 999));
  const cheaperThem = rows.filter(r => r.diff != null && r.diff < -1).length, cheaperMe = rows.filter(r => r.diff != null && r.diff > 1).length;
  const lowMargin = rows.filter(r => r.margin != null && r.margin < target).length;

    <div class="card kpi"><span>ئەوان هەرزانترن</span><b style="color:var(--warn)">${cheaperThem}</b></div>
    <div class="card kpi good"><span>تۆ هەرزانتریت</span><b>${cheaperMe}</b></div>
    <div class="card kpi"><span>قازانجی کەمتر لە ${Math.round(target * 100)}٪</span><b>${lowMargin}</b><em>${Object.keys(S.costs).length ? '' : 'تێچوو دانەنراوە'}</em></div>
  </div>
  <div class="card mt"><h3>💰 نرخ و قازانج <small>بەراورد بە دۆلار · ١$ = ${fmtN(S.settings.usdToIqd)} د.ع · نرخی پێشنیارکراو بە دراوی سایتەکەت</small>${exportBtns('pricing')}</h3>
    <div class="hint" style="margin-bottom:8px">نرخی پێشنیارکراو = کەمێک خوار ناوەندی ڕکابەرەکان، بەڵام هەرگیز خوار ئەو نرخە نا کە قازانجی ${Math.round(target * 100)}٪ دەدات (ئەگەر تێچوو دانرابێت). تێچوو لە پەنجەرەی هەر کاڵایەک دابنێ.</div>
    <div class="scroll"><table><thead><tr><th>کاڵای من</th><th>نرخی من</th><th>هەرزانترین ڕکابەر</th><th>ناوەند</th><th>دۆخ</th><th>تێچوو</th><th>قازانج</th><th>نرخی پێشنیارکراو</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="click" onclick="openItem('${r.a.site}','${r.a.key}')">
      <td><div class="ell" style="max-width:220px">${esc(r.a.name)}</div><div class="muted" style="font-size:12px">${r.rivals.map(x => esc(siteById(x.b.site)?.name)).join('، ')}</div></td>

      <td style="white-space:nowrap">${p.confirmed ? '<span class="pill">✓</span>' : `<span class="pill gold">پێشنیار</span>${isAdmin() ? ` <button class="btn small" onclick="setMatch('${ID(p.a)}','${ID(p.b)}',true)">✓</button> <button class="btn small" onclick="setMatch('${ID(p.a)}','${ID(p.b)}',false)">✕</button>` : ''}`}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">—</td></tr>'}
    </tbody></table></div></div>`;
  EXPORTS.pricing = () => downloadCSV('pricing', ['my_item', 'my_price', 'currency', 'cheapest_rival_usd', 'median_rival_usd', 'diff_pct', 'cost', 'margin_pct', 'suggested_price'],
    rows.map(r => [r.a.name, r.a.price, r.cur, r.min?.toFixed(2), r.med?.toFixed(2), r.diff?.toFixed(0), S.costs[ID(r.a)] ?? '', r.margin == null ? '' : Math.round(r.margin * 100), r.sugLocal ?? '']));
}
async function setMatch(mine, other, ok) {
  const m = S.matches;
  m.confirmed = m.confirmed.filter(c => !(c.mine === mine && c.other === other));
  m.rejected = m.rejected.filter(c => !(c.mine === mine && c.other === other));
  (ok ? m.confirmed : m.rejected).push({mine, other});
  try { await save('config/matches.json', m, ok ? 'confirm match' : 'reject match'); toast(ok ? 'پشتڕاست کرایەوە' : 'لابرا'); } catch (e) { toast('هەڵە: ' + e.message); }
  invalidate(); renderPricing();
}

/* ---------- reports: category trend + seasonal ---------- */
function trendSeasonHTML(ids, all) {
  const t = today();
  const weeks = [3, 2, 1, 0].map(w => ({from: addDays(t, -7 * w - 6), to: addDays(t, -7 * w)}));
  const cat = {};
  for (const it of all) {
    const c = it.category || 'تر'; const row = (cat[c] ||= [0, 0, 0, 0]);
    for (const [ds, u] of Object.entries(it.daily)) weeks.forEach((w, i) => { if (ds >= w.from && ds <= w.to) row[i] += u; });
  }
  const trend = Object.entries(cat).map(([c, w]) => ({c, w, ch: w[2] ? (w[3] - w[2]) / w[2] * 100 : null})).filter(r => r.w.some(Boolean)).sort((a, b) => b.w[3] - a.w[3]);
  const maxW = Math.max(1, ...trend.flatMap(r => r.w));
  // seasonal: month × category from catMonthly (all history)
  const cm = {};
  for (const id of ids) for (const [mm, row] of Object.entries(S.stats[id]?.catMonthly || {})) for (const [c, u] of Object.entries(row)) ((cm[c] ||= {})[mm] = (cm[c][mm] || 0) + u);

  const maxS = Math.max(1, ...seasonal.flatMap(s => months.map(m => s.r[m] || 0)));
  const shade = (v, max) => `background:color-mix(in srgb, var(--bar) ${Math.round(v / max * 85)}%, transparent)`;
  const wl = w => `${+w.from.slice(8)}/${+w.from.slice(5, 7)}`;
  const html = `
  <div class="card mt"><h3>📈 ترێندی بەشەکان <small>فرۆشی ٤ هەفتەی ڕابردوو · دانە</small>${exportBtns('trend')}</h3>

    ${trend.map(r => `<tr><td>${esc(r.c)}</td>${r.w.map(v => `<td class="n"><div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><span class="num">${fmtN(v)}</span><span style="display:inline-block;height:6px;width:${Math.round(v / maxW * 60)}px;background:var(--bar);border-radius:3px"></span></div></td>`).join('')}
      <td class="n ${r.ch > 0 ? 'up' : r.ch < 0 ? 'down' : ''}"><b>${r.ch == null ? '—' : (r.ch > 0 ? '▲ ' : r.ch < 0 ? '▼ ' : '') + pct(r.ch)}</b></td></tr>`).join('') || '<tr><td colspan="6" class="muted">هێشتا داتا نییە</td></tr>'}
    </tbody></table></div></div>
  <div class="card mt"><h3>🗓️ ڕاپۆرتی وەرز <small>فرۆشی هەر بەشێک لە هەر مانگێکدا — تاریکتر = زیاتر</small>${exportBtns('season')}</h3>
    ${months.length < 3 ? `<div class="banner">ئەم ڕاپۆرتە دوای <b>چەند مانگێک</b> داتا بەسوود دەبێت (ئێستا ${months.length} مانگ). وەرزەکانی وەک گەڕانەوەی قوتابخانە، ڕەمەزان و کۆتایی ساڵ لێرە دەردەکەون.</div>` : ''}
    <div class="scroll"><table class="heat"><thead><tr><th>بەش</th>${months.map(m => `<th>${KU_MONTHS[+m.slice(5) - 1]}<br><small class="muted">${m.slice(0, 4)}</small></th>`).join('')}</tr></thead><tbody>
    ${seasonal.map(s => `<tr><td style="text-align:start">${esc(s.c)}</td>${months.map(m => `<td style="${shade(s.r[m] || 0, maxS)}" class="num">${s.r[m] ? fmtN(s.r[m]) : ''}</td>`).join('')}</tr>`).join('') || '<tr><td class="muted">—</td></tr>'}
    </tbody></table></div></div>`;
  EXPORTS.trend = () => downloadCSV('category-trend', ['category', ...weeks.map(w => w.from), 'change_pct'], trend.map(r => [r.c, ...r.w, r.ch?.toFixed(0) ?? '']));
  EXPORTS.season = () => downloadCSV('seasonal', ['category', ...months], seasonal.map(s => [s.c, ...months.map(m => s.r[m] || 0)]));

}

/* ---------- month vs last month (fair: same number of days) ---------- */
function momFor(id) {
  const t = today(), d = +t.slice(8), m = monthOf(t);
  const pm = (() => { const x = new Date(m + '-01T12:00:00Z'); x.setUTCMonth(x.getUTCMonth() - 1); return x.toISOString().slice(0, 7); })();
  const daily = S.stats[id]?.daily || {}, cur = siteById(id)?.currency;
  let u = 0, r = 0, pu = 0, pr = 0, pfull = 0;
  for (const [ds, v] of Object.entries(daily)) {
    if (ds.startsWith(m)) { u += v.u; r += toUSD(v.r, cur); }
    if (ds.startsWith(pm)) { pfull += v.u; if (+ds.slice(8) <= d) { pu += v.u; pr += toUSD(v.r, cur); } }
  }
  const hasPrev = Object.keys(daily).some(ds => ds.startsWith(pm));
  return {u, r, pu, pr, pfull, pm, hasPrev, ch: hasPrev && pu ? (u - pu) / pu * 100 : null};
}
function momCard(ids) {
  const rows = ids.map(id => ({id, ...momFor(id)}));

const R = Object.assign({site: 'all', cat: '', color: '', period: 'month', off: 0, from: '', to: '', sort: 'pu', dir: -1, view: 'grid', more: 0}, store.get('rep', {}));
function setR(p) { Object.assign(R, p); store.set('rep', R); renderReports(); }
function repRange() {
  const t = today();
  if (R.period === 'today') { const d = addDays(t, -R.off); return {from: d, to: d}; }
  if (R.period === 'week') { const to = addDays(t, -7 * R.off); return {from: addDays(to, -6), to}; }
  if (R.period === 'month') {
    const d = new Date(t.slice(0, 8) + '01T12:00:00Z'); d.setUTCMonth(d.getUTCMonth() - R.off);
    const from = d.toISOString().slice(0, 10), e = new Date(d); e.setUTCMonth(e.getUTCMonth() + 1); e.setUTCDate(0);
    const to = e.toISOString().slice(0, 10); return {from, to: to > t ? t : to};
  }
  let from = R.from || addDays(t, -29), to = R.to || t; if (from > to) [from, to] = [to, from];
  const len = Math.round((Date.parse(to) - Date.parse(from)) / 864e5) + 1;
  return {from: addDays(from, -len * R.off), to: addDays(to, -len * R.off)};
}
const daysBetween = (from, to) => { const o = []; for (let d = from; d <= to && o.length < 400; d = addDays(d, 1)) o.push(d); return o; };
const unitsIn = (it, from, to) => { let u = 0; for (const d in it.daily) if (d >= from && d <= to) u += it.daily[d]; return u; };
const fmtDay = ds => `${+ds.slice(8)} ${KU_MONTHS[+ds.slice(5, 7) - 1]}`;
const ICON = {

function pillChart(vals, labels, {h = 250, w = 1100, hi = -1, fmt = fmtN, tip = null} = {}) {
  const pad = {t: 52, b: 30, l: 8, r: 8}, n = Math.max(vals.length, 1), max = Math.max(1, ...vals), bw = (w - pad.l - pad.r) / n;
  const bwid = Math.max(4, Math.min(24, bw * .56)), ih = h - pad.t - pad.b, every = Math.ceil(n / 16);
  if (hi < 0) hi = bestIdx(vals);
  const X = i => (LANG === 'en' ? pad.l + i * bw : w - pad.r - (i + 1) * bw) + bw / 2;
  let g = `<defs><linearGradient id="pgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent2)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient></defs>`;
  for (let k = 1; k <= 3; k++) { const y = pad.t + ih - ih * k / 3; g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="4 6"/>`; }
  vals.forEach((v, i) => {
    const bh = Math.max(v ? 6 : 3, v / max * ih), x = X(i) - bwid / 2, y = pad.t + ih - bh;
    g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwid.toFixed(1)}" height="${bh.toFixed(1)}" rx="${Math.min(bwid / 2, 12).toFixed(1)}" fill="${i === hi ? 'url(#pgA)' : 'var(--bar2)'}"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`;
    if (i % every === 0 || i === hi) g += `<text x="${X(i).toFixed(1)}" y="${h - 8}" text-anchor="middle" ${i === hi ? 'style="fill:var(--ink);font-weight:600"' : ''}>${esc(labels[i])}</text>`;
  });
  if (vals[hi] > 0) {
    const cx = X(hi), y = pad.t + ih - Math.max(6, vals[hi] / max * ih) - 12, txt = tip ? tip(hi) : fmt(vals[hi]), tw = Math.max(64, String(txt).length * 8 + 24);
    const bx = Math.min(Math.max(cx - tw / 2, 2), w - tw - 2);
    g += `<rect x="${bx}" y="${y - 30}" width="${tw}" height="28" rx="9" fill="var(--ink)"/><path d="M${cx - 6} ${y - 2.5}l6 7 6-7z" fill="var(--ink)"/>

    ${sec('🔁 تەواوبوون و دووبارە داواکرانەوە (٣٠ ڕۆژ)', reo, (r, i) => itemRow(r.it, i, r.q, `⛔ ${r.outAt ? shortDate(r.outAt) : '—'} → 📦 ${shortDate(r.backAt)}${r.days != null ? ` · ${r.days} ڕۆژ` : ''}`), '<p class="hint">ئەو کاڵایانەی تەواو بوون و پاشان کۆگاکەیان دووبارە پڕ کرایەوە — واتە ڕکابەرەکە دووبارە داوای کردووەتەوە. نیشانەی کاڵای باش فرۆشە.</p>')}
    ${sec('📦 کاڵا هاتنەوە (٧ ڕۆژ)', rest, (r, i) => itemRow(r.it, i, r.q, localDate(new Date(r.t))))}
    ${sec('📊 فرۆشی گەورە (بە کۆمەڵ)', big, (r, i) => `<li><span class="rank">${i + 1}</span>${thumb(r.it)}<div class="grow" onclick="openItem('${r.site}','${r.k}')"><div class="ell">${esc(r.it.name)}</div><div class="muted" style="font-size:12px">${localDate(new Date(r.t))} · ئاسایی: ~${fmtN(r.usual)} · ${esc(siteById(r.site)?.name)}</div></div><div class="endcol"><b class="num">${fmtN(r.q)}</b><div>${r.excluded ? '<span class="pill gray">لابراوە</span>' : isAdmin() ? `<button class="btn small" onclick="excludeMove('${r.site}','${r.k}','${r.t}')">حیسابی مەکە</button>` : ''}</div></div></li>`,
      '<p class="hint">دابەزینێکی زۆر گەورەتر لە ئاسایی. زۆربەی جار داواکاری کۆمپانیایە (ڕاستەقینە)، بەڵام ئەگەر ڕاستکردنەوەی کۆگا بێت، "حیسابی مەکە" دابگرە.</p>')}
    ${sec('🧹 ڕاستکردنەوەی کۆگا (حیساب نەکراون)', corr, (r, i) => itemRow(r.it, i, r.q, localDate(new Date(r.t))), '<p class="hint">کەمبوونێک کە دواتر هەمان ژمارە گەڕایەوە — وەک فرۆشتن حیساب نەکراوە.</p>')}
    ${sec('🗑️ لە سایتەکە لابراون', removed, (it, i) => itemRow(it, i, null, 'دوایین جار: ' + localDate(new Date(it.lastSeen))))}
  </div>`;
}
async function excludeMove(site, key, t) {
  S.excl.push({site, key, t});
  try { await save('config/exclusions.json', S.excl, 'exclude stock move'); toast('لابرا — لە کۆکردنەوەی داهاتوودا حیساب دەکرێتەوە'); } catch (e) { S.excl.pop(); toast('هەڵە: ' + e.message); }
}

/* ---------- admin ---------- */
const RECIPES = {pending: 'چاوەڕێی ڕێنمایی', mitmane: 'Mitmane (Printway)', penna: 'Penna', promo365: '365 Promo', noon: 'noon1968', generic: 'Generic (پێویستی بە ڕێکخستنە)'};
async function renderAdmin(connOnly = false) {
  const c = conn || {owner: '', repo: '', branch: 'main', token: '', role: 'admin'};
  const siteRows = S.sites.map((s, i) => {
    const st = S.status.sites?.[s.id];
    const stat = !st ? '<span class="pill gray">هێشتا نەکراوە</span>' : st.ok ? `<span class="pill">✓ ${fmtN(st.items)} کاڵا · ${ago(st.at)}</span>` : `<span class="pill warn" title="${esc(st.error)}">✗ ${esc((st.error || '').slice(0, 40))}</span>`;
    return `<tr><td><b>${esc(s.name)}</b><div class="muted ell" style="font-size:12px;max-width:240px">${esc(s.url)}</div><input type="text" dir="ltr" data-i="${i}" data-f="productUrl" value="${esc(s.productUrl || '')}" placeholder="https://…/product/{id}" title="لینکی کاڵا" style="font-size:12px;margin-top:4px;width:240px"><input type="url" dir="ltr" data-i="${i}" data-f="logo" value="${esc(s.logo || '')}" placeholder="لۆگۆ (ئارەزوومەندانە) https://…/logo.png" title="لۆگۆ" style="font-size:12px;margin-top:4px;width:240px;display:block"></td>
      <td><select data-i="${i}" data-f="recipe">${Object.entries(RECIPES).map(([r, t]) => `<option value="${r}" ${s.recipe === r ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
      <td>${stat}${s.note && s.recipe === 'pending' ? `<div class="hint">${esc(s.note)}</div>` : ''}</td>
      <td><label class="switch"><input type="checkbox" data-i="${i}" data-f="enabled" ${s.enabled ? 'checked' : ''}> چالاک</label></td>
      <td><label class="switch"><input type="checkbox" data-i="${i}" data-f="mine" ${s.mine ? 'checked' : ''}> سایتی منە</label></td>
      <td><button class="btn small" data-del="${i}">سڕینەوە</button></td></tr>`;
  }).join('');
  $('#main').innerHTML = `
  ${connOnly ? '' : `
  <div class="card"><h3>سایتەکان</h3>
    <div class="scroll"><table><thead><tr><th>سایت</th><th>ڕێنمایی</th><th>دۆخ</th><th></th><th></th><th></th></tr></thead><tbody id="sitesBody">${siteRows || '<tr><td colspan="6" class="muted">هیچ سایتێک نییە</td></tr>'}</tbody></table></div>
    <div class="tools" style="margin-top:12px"><button class="btn primary" id="saveSites">پاشەکەوتکردنی گۆڕانکارییەکان</button><span class="hint" id="sitesDirty"></span></div>
  </div>
  <div class="card mt"><h3>+ زیادکردنی سایت</h3>
    <div class="form">
      <label class="f">ناو<input type="text" id="nName" placeholder="بۆ نموونە: Shop X"></label>
      <label class="f">لینک<input type="url" id="nUrl" placeholder="https://…" dir="ltr"></label>
      <label class="f">دراو<select id="nCur"><option>USD</option><option>IQD</option></select></label>
      <label class="switch"><input type="checkbox" id="nMine"> سایتی منە</label>
      <button class="btn primary" id="addSite">زیادکردن</button>
    </div>
    <p class="hint">دوای زیادکردن، لینکەکە بۆ Claude بنێرە تا ڕێنمایی (recipe)ی ئەو سایتە بنووسێت. ئەگەر لە خوارەوەی سایتەکە "POWERED BY MITMANE" هەبوو، <b>Mitmane</b> هەڵبژێرە.</p>
  </div>
  <div class="grid two mt">
    <div class="card"><h3>کۆکردنەوە و ڕاپۆرت</h3>
      <p class="hint">کۆکردنەوە بە خۆکاری هەر ٣ کاتژمێر جارێک کار دەکات. ڕاپۆرتی تەلەگرام هەموو شەوێک کاتژمێر ١٠.</p>
      <div class="tools"><button class="btn primary" id="runNow">▶ ئێستا کۆبکەرەوە</button><button class="btn" id="reportNow">📨 ڕاپۆرتی تەلەگرام ئێستا</button><button class="btn" id="monthlyNow">📑 ڕاپۆرتی مانگانە ئێستا</button><button class="btn" id="backupNow">💾 باکئەپ ئێستا</button></div>
      <div id="runs" class="hint" style="margin-top:10px"></div>
      ${conn ? `<p class="hint">ڕاپۆرتە مانگانەکان و باکئەپەکان: <a href="https://github.com/${esc(conn.owner)}/${esc(conn.repo)}/releases" target="_blank" rel="noopener">Releases ↗</a></p>` : ''}</div>
    <div class="card"><h3>ڕێکخستن</h3>
      <div class="form"><label class="f">نرخی ١ دۆلار بە دینار<input type="number" id="rate" value="${esc(S.settings.usdToIqd || 1450)}"></label>
      <label class="f">ئامانجی قازانج (٪)<input type="number" id="margin" value="${esc(S.settings.targetMargin ?? 25)}"></label>
      <button class="btn" id="saveSettings">پاشەکەوت</button></div></div>
  </div>`}
  <div class="card mt"><h3>پەیوەندی بە GitHub <small>${mode === 'github' ? '✓ پەیوەستە' : mode === 'demo' ? 'دۆخی نموونە' : ''}</small></h3>
    <div class="form">
      <label class="f">خاوەن (username)<input type="text" id="cOwner" value="${esc(c.owner)}" dir="ltr"></label>
      <label class="f">Repo<input type="text" id="cRepo" value="${esc(c.repo || 'market-tracker')}" dir="ltr"></label>
      <label class="f">Branch<input type="text" id="cBranch" value="${esc(c.branch || 'main')}" dir="ltr"></label>
      <label class="f">Token<input type="password" id="cToken" value="${esc(c.token)}" dir="ltr" placeholder="github_pat_…"></label>
      <label class="f">ڕۆڵ<select id="cRole"><option value="admin" ${c.role !== 'viewer' ? 'selected' : ''}>ئادمین</option><option value="viewer" ${c.role === 'viewer' ? 'selected' : ''}>کارمەند (تەنها بینین)</option></select></label>
      <button class="btn primary" id="saveConn">پەیوەستبوون</button>
      ${conn ? '<button class="btn" id="logout">چوونەدەرەوە</button>' : ''}
    </div>
    <p class="hint">Token تەنها لەم وێبگەڕەدا هەڵدەگیرێت.</p>
  </div>
  ${connOnly ? '' : `<div class="card mt"><h3>👥 دەستپێگەیشتنی کارمەندان</h3>
    <ol class="hint" style="padding-inline-start:18px">
      <li>لە GitHub Tokenێکی نوێ دروست بکە (Fine-grained) تەنها بۆ <b>market-tracker</b> بە <b>Contents: Read-only</b> — هیچی تر.</li>
      <li>ئەم فایلەی داشبۆرد بۆ کارمەندەکە بکەرەوە، username و Repo و ئەو Tokenە دابنێ و ڕۆڵ بکە <b>کارمەند</b>.</li>
      <li>کارمەند هەموو ڕاپۆرتەکان دەبینێت، بەڵام بەشی ئادمین، تێبینی، تێچوو و گۆڕانکاری بۆی داخراوە. چونکە Tokenەکەی تەنها خوێندنەوەیە، تەنانەت ئەگەر هەوڵیش بدات ناتوانێت هیچ بگۆڕێت.</li>
      <li>ئەگەر کارمەندێک ڕۆیشت، Tokenەکەی لە GitHub بسڕەوە.</li>
    </ol></div>`}`;

  $('#saveConn').onclick = () => {
    const v = {owner: $('#cOwner').value.trim(), repo: $('#cRepo').value.trim(), branch: $('#cBranch').value.trim() || 'main', token: $('#cToken').value.trim(), role: $('#cRole').value};
    if (!v.owner || !v.repo || !v.token) return toast('هەموو خانەکان پڕ بکەرەوە');
    store.set('conn', v); store.del('demo'); location.reload();
  };
  if ($('#logout')) $('#logout').onclick = () => { store.del('conn'); location.reload(); };
  if (connOnly) return;

  const markDirty = () => $('#sitesDirty').textContent = 'گۆڕانکاری پاشەکەوت نەکراوە';
  $('#sitesBody').onchange = e => { const el = e.target, i = +el.dataset.i; if (isNaN(i)) return; S.sites[i][el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; markDirty(); };
  $('#sitesBody').onclick = e => { const b = e.target.closest('[data-del]'); if (!b) return; const s = S.sites[+b.dataset.del]; if (prompt(`بۆ سڕینەوەی "${s.name}" ناوەکەی بنووسە:`) !== s.name) return; S.sites.splice(+b.dataset.del, 1); renderAdmin(); markDirty(); };
  $('#saveSites').onclick = async () => { try { await save('config/sites.json', S.sites, 'update sites'); toast('پاشەکەوت کرا'); $('#sitesDirty').textContent = ''; invalidate(); fillSiteSel(); } catch (e) { toast('هەڵە: ' + e.message); } };
  $('#addSite').onclick = async () => {
    const name = $('#nName').value.trim(), url = $('#nUrl').value.trim();
    if (!name || !/^https?:\/\//.test(url)) return toast('ناو و لینکێکی دروست بنووسە');
    let id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'site'; while (S.sites.some(s => s.id === id)) id += '-2';
    S.sites.push({id, name, url, recipe: 'pending', currency: $('#nCur').value, enabled: false, mine: $('#nMine').checked, note: 'ڕێنمایی (recipe) هێشتا نەنووسراوە — لینکەکە بۆ Claude بنێرە'});
    try { await save('config/sites.json', S.sites, `add site ${name}`); toast('زیاد کرا'); renderAdmin(); } catch (e) { toast('هەڵە: ' + e.message); }
  };
  $('#saveSettings').onclick = async () => {
    S.settings.usdToIqd = +$('#rate').value || 1450; S.settings.targetMargin = +$('#margin').value || 25;
    try { await save('config/settings.json', S.settings, 'update settings'); toast('پاشەکەوت کرا'); invalidate(); } catch (e) { toast('هەڵە: ' + e.message); }
  };
  const dispatchBtn = (sel, wf, msg) => $(sel).onclick = async () => {
    if (mode !== 'github') return toast('لە دۆخی نموونەدا ناکرێت');
    try { await gh.dispatch(wf); toast(msg); setTimeout(showRuns, 4000); } catch (e) { toast('هەڵە: ' + e.message); }
  };
  dispatchBtn('#runNow', 'collect.yml', 'دەستی پێکرد — چەند خولەکێکی دەوێت');
  dispatchBtn('#reportNow', 'report.yml', 'ڕاپۆرت دەنێردرێت…');
  dispatchBtn('#backupNow', 'backup.yml', 'باکئەپ دروست دەکرێت…');
  dispatchBtn('#monthlyNow', 'monthly.yml', 'ڕاپۆرتی مانگانە دروست دەکرێت…');
  showRuns();
}
async function showRuns() {
  const el = $('#runs'); if (!el || mode !== 'github') return;
  try {
    const runs = await gh.runs();
    const label = r => r.status !== 'completed' ? '<span class="pill gold">کار دەکات…</span>' : r.conclusion === 'success' ? '<span class="pill">✓ سەرکەوتوو</span>' : `<span class="pill warn">✗ ${esc(r.conclusion)}</span>`;
    el.innerHTML = runs.length ? runs.map(r => `<div>${label(r)} ${ago(r.created_at)} · <a href="${esc(r.html_url)}" target="_blank" rel="noopener">وردەکاری</a></div>`).join('') : 'هیچ کۆکردنەوەیەک نەکراوە';
  } catch { el.textContent = ''; }
}

/* ---------- login ---------- */
function renderLogin() {
  $('#siteSel').classList.add('hide');
  $('#nav').classList.add('hide'); $('#pageTitle').textContent = 'چاودێری بازاڕ';
  $('#main').innerHTML = `<div class="card login">
    <h2 style="margin-top:0">بەخێربێیت 👋</h2>
    <p>بۆ بینینی داتاکان، بە Repo ـە Privateـەکە لە GitHub پەیوەست ببە.</p>
    <ol>
      <li>GitHub → <b>Settings → Developer settings → Fine-grained tokens</b></li>
      <li><b>Generate new token</b> → تەنها Repo ـی <b>market-tracker</b></li>
      <li>ئادمین: <b>Contents</b> و <b>Actions</b> = Read and write · کارمەند: تەنها <b>Contents</b> = Read-only</li>
    </ol>
    <div class="form" style="grid-template-columns:1fr 1fr">
      <label class="f">GitHub username<input type="text" id="lOwner" dir="ltr"></label>
      <label class="f">Repo<input type="text" id="lRepo" value="market-tracker" dir="ltr"></label>
      <label class="f" style="grid-column:1/-1">Token<input type="password" id="lToken" dir="ltr" placeholder="github_pat_…"></label>
      <label class="f" style="grid-column:1/-1">ڕۆڵ<select id="lRole"><option value="admin">ئادمین</option><option value="viewer">کارمەند (تەنها بینین)</option></select></label>
    </div>
    <div class="tools" style="margin-top:14px"><button class="btn primary" id="lGo">پەیوەستبوون</button>
    ${DEMO ? '<button class="btn" id="lDemo">بینینی نموونە</button>' : ''}</div></div>`;
  $('#lGo').onclick = () => {
    const v = {owner: $('#lOwner').value.trim(), repo: $('#lRepo').value.trim(), branch: 'main', token: $('#lToken').value.trim(), role: $('#lRole').value};
    if (!v.owner || !v.repo || !v.token) return toast('هەموو خانەکان پڕ بکەرەوە');
    store.set('conn', v); location.reload();
  };
  if ($('#lDemo')) $('#lDemo').onclick = () => { store.set('demo', true); location.reload(); };
}
function exitDemo() { store.del('demo'); location.reload(); }

/* ---------- installable app (works when served over https, e.g. on your website) ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

boot();
</script>
</body>
</html>

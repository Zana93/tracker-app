<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f4fae">
<title>چاودێری بازاڕ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root{--bg:#f1eadf;--panel:#fcfaf6;--ink:#14284a;--muted:#8c8478;--accent:#1f4fae;--line:#e6ddcd}
  @media (prefers-color-scheme:dark){:root{--bg:#0c1628;--panel:#13213a;--ink:#f1e9da;--muted:#9ba4b6;--line:#23344f;--accent:#6f9be0}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px}
  .box{width:100%;max-width:420px;background:var(--panel);border-radius:22px;padding:26px;box-shadow:0 10px 30px rgba(60,45,20,.08);border:1px solid var(--line)}
  h1{font-size:22px;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 16px;font-size:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .link{display:block;margin-top:14px;text-align:center;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;background:none;border:0;width:100%;padding:0;font-weight:400}
  .err{color:#d93a5b;font-size:14px;margin-top:10px;min-height:1em}
  .spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:s 1s linear infinite;margin:0 auto}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div></div>
<script>
(() => { // own scope: the dashboard is written into this same page, so nothing here may clash with its names
// Public loader: holds no data and no program. After sign-in it loads the real dashboard
// from your PRIVATE repo with your token, so nothing about what you track is public.
const K = 'mt.conn', CACHE = 'mt.shell';
const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const box = document.getElementById('box');

// password sign-in: login.json holds the token encrypted with the password (PBKDF2-SHA256 + AES-GCM)
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openSeal(pw, e) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64u8(e.salt), iterations: e.iter || 600000, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64u8(e.iv)}, key, b64u8(e.data))));
}
let LOGIN = null;
async function loadLogin() { if (LOGIN === null || !LOGIN.length) { try { const r = await fetch('login.json?t=' + Date.now(), {cache: 'no-store'}); LOGIN = r.ok ? await r.json() : []; } catch { LOGIN = []; } } }
function pwForm(msg) {
  box.innerHTML = `<h1 style="display:flex;align-items:center;gap:10px"><img src="icon.svg" width="38" height="38" alt="">چاودێری بازاڕ</h1><p>بە ناو و پاسۆردی خۆت بچۆ ژوورەوە.</p>
    <label>ناو</label><input id="un" autocomplete="username" autocapitalize="none" spellcheck="false" dir="auto" value="${(get('mt.lastUser') || '').replace(/[&<>"]/g, '')}">
    <label>پاسۆرد</label><input id="pw" type="password" autocomplete="current-password">
    <button id="go">چوونەژوورەوە</button><div class="err" id="er">${msg || ''}</div>
    <button class="link" id="fg">پاسۆردت لەبیر چووە؟</button>`;
  const $ = id => document.getElementById(id);
  const go = async () => {
    const un = $('un').value.trim().toLowerCase(), pw = $('pw').value; if (!un || !pw) return;
    $('go').disabled = true; $('go').textContent = '…'; $('er').textContent = '';
    for (const e of LOGIN.filter(e => (e.user || 'admin').toLowerCase() === un)) {
      try { const c = await openSeal(pw, e); set(K, {...c, user: e.user || c.user || 'admin', role: c.role}); set('mt.lastUser', un); return start(); } catch {}
    }
    $('go').disabled = false; $('go').textContent = 'چوونەژوورەوە'; $('er').textContent = 'ناو یان پاسۆرد هەڵەیە';
  };
  $('go').onclick = go; $('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  ($('un').value ? $('pw') : $('un')).focus();
  $('fg').onclick = () => forgot();
}
// forgotten password: every account can have a recovery code that was emailed to its owner (link #reset=user:CODE).
// The code unlocks a second sealed copy of the token; then a new password is sealed and saved.
const normCode = c => { const x = String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return x.replace(/(.{5})(?=.)/g, '$1-'); };
const u8b64 = u => btoa(String.fromCharCode(...u));
async function seal(pw, payload) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 600000;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt']);
  const data = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(payload))));
  return {v: 1, iter, salt: u8b64(salt), iv: u8b64(iv), data: u8b64(data)};
}
function forgot(msg, user) {
  box.innerHTML = `<h1 style="display:flex;align-items:center;gap:10px"><img src="icon.svg" width="38" height="38" alt="">پاسۆردت لەبیر چووە؟</h1>
    <p>ئەو ئیمەیڵەی کاتی دروستکردنی ئەکاونتەکەت هات بکەرەوە و <b>لینکەکەی</b> دابگرە. یان ناوەکەت و <b>کۆدەکەی ناو ئیمەیڵەکە</b> لێرە بنووسە.</p>
    <label>ناو</label><input id="fu" autocapitalize="none" spellcheck="false" dir="auto" value="${String(user || get('mt.lastUser') || '').replace(/[&<>"]/g, '')}">
    <label>کۆدی ئیمەیڵ</label><input id="fc" dir="ltr" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX">
    <button id="fgo">بەردەوامبوون</button><div class="err" id="fer">${msg || ''}</div>
    <p style="margin-top:14px;font-size:13px">ئەگەر ئیمەیڵت بۆ ئەکاونتەکە دانەنابوو: ئادمینێکی تر دەتوانێت لە <b>👥 ئەکاونتەکان</b> پاسۆردێکی نوێت بۆ دابنێت، یان بە Tokenـی GitHub بچۆ ژوورەوە.</p>
    <button class="link" id="tk">چوونەژوورەوە بە Token</button>
    <button class="link" id="bk">گەڕانەوە</button>`;
  const $ = id => document.getElementById(id);
  $('tk').onclick = () => form(); $('bk').onclick = () => pwForm();
  $('fgo').onclick = () => { const u = $('fu').value.trim(), c = $('fc').value.trim(); if (u && c) resetFlow(u, c); };
}
async function resetFlow(user, code) {
  await loadLogin();
  const un = String(user).trim().toLowerCase(), e = (LOGIN || []).find(x => (x.user || 'admin').toLowerCase() === un);
  if (!e || !e.rec) return forgot(e ? 'ئەم ئەکاونتە ئیمەیڵی بۆ دانەنراوە.' : 'ئەم ناوە نییە.', user);
  box.innerHTML = '<div class="spin"></div>';
  let c;
  try { c = await openSeal(normCode(code), e.rec); } catch { return forgot('کۆدەکە هەڵەیە.', user); }
  c = {...c, user: e.user || c.user || 'admin'};
  box.innerHTML = `<h1 style="display:flex;align-items:center;gap:10px"><img src="icon.svg" width="38" height="38" alt="">پاسۆردی نوێ</h1><p><b>${un.replace(/[&<>"]/g, '')}</b> — پاسۆردێکی نوێ دابنێ.</p>
    <label>پاسۆردی نوێ</label><input id="n1" type="password" autocomplete="new-password">
    <label>دووبارە</label><input id="n2" type="password" autocomplete="new-password">
    <button id="nsave">پاشەکەوتکردن و چوونەژوورەوە</button><div class="err" id="ner"></div>`;
  const $ = id => document.getElementById(id);
  $('n1').focus();
  $('nsave').onclick = async () => {
    const a = $('n1').value, b = $('n2').value;
    if (a.length < 8) return $('ner').textContent = 'پاسۆرد دەبێت لانیکەم ٨ پیت بێت';
    if (a !== b) return $('ner').textContent = 'دوو پاسۆردەکە وەک یەک نین';
    $('nsave').disabled = true; $('nsave').textContent = '…';
    const appRepo = location.pathname.split('/').filter(x => x && !x.includes('.'))[0] || 'tracker-app';
    const url = `https://api.github.com/repos/${c.owner}/${appRepo}/contents/login.json`, H = {Authorization: `Bearer ${c.token}`, 'X-GitHub-Api-Version': '2022-11-28'};
    let saved = false;
    try {
      const m = await fetch(url + '?t=' + Date.now(), {headers: H, cache: 'no-store'}); const mj = await m.json();
      const L = JSON.parse(decodeURIComponent(escape(atob(mj.content.replace(/\n/g, '')))));
      const fresh = await seal(a, {owner: c.owner, repo: c.repo, branch: c.branch || 'main', token: c.token, role: c.role, user: c.user});
      const out = L.map(x => (x.user || 'admin').toLowerCase() === un ? {...x, ...fresh} : x);
      const r = await fetch(url, {method: 'PUT', headers: {...H, 'Content-Type': 'application/json'}, body: JSON.stringify({message: 'reset password: ' + un, sha: mj.sha, content: btoa(unescape(encodeURIComponent(JSON.stringify(out, null, 1) + '\n')))})});
      saved = r.ok;
    } catch {}
    set(K, c); set('mt.lastUser', un);
    if (!saved) { alert('چوویتە ژوورەوە، بەڵام پاسۆردەکە نەگۆڕدرا (ئەم ئەکاونتە مۆڵەتی گۆڕینی نییە). داوا لە ئادمین بکە پاسۆردێکی نوێت بۆ دابنێت.'); }
    LOGIN = null; start();
  };
}
function form(msg) {
  const c = get(K) || (LOGIN && LOGIN.find(x => x.owner) ? {owner: LOGIN.find(x => x.owner).owner, repo: LOGIN.find(x => x.owner).repo} : {}), e = x => String(x || '').replace(/[&<>"]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[m]));
  box.innerHTML = `<h1 style="display:flex;align-items:center;gap:10px"><img src="icon.svg" width="38" height="38" alt="">چاودێری بازاڕ</h1><p>بە GitHub پەیوەست ببە.</p>
    <label>GitHub username</label><input id="o" dir="ltr" value="${e(c.owner)}">
    <label>Repo</label><input id="r" dir="ltr" value="${e(c.repo)}">
    <label>Token</label><input id="t" type="password" dir="ltr" placeholder="github_pat_…">
    <label>ڕۆڵ</label><select id="l"><option value="admin">ئادمین</option><option value="viewer" ${c.role === 'viewer' ? 'selected' : ''}>کارمەند (تەنها بینین)</option></select>
    <button id="go">پەیوەستبوون</button><div class="err">${msg || ''}</div>${LOGIN && LOGIN.length ? '<button class="link" id="pwb">چوونەژوورەوە بە پاسۆرد</button>' : ''}`;
  if (document.getElementById('pwb')) document.getElementById('pwb').onclick = () => pwForm();
  document.getElementById('go').onclick = () => {
    const $ = id => document.getElementById(id);
    const v = {owner: $('o').value.trim(), repo: $('r').value.trim(), branch: 'main', token: $('t').value.trim(), role: $('l').value};
    if (!v.owner || !v.repo || !v.token) return;
    set(K, v); start();
  };
}
function show(html) { document.open(); document.write(html); document.close(); }
async function start() {
  const rs = location.hash.match(/^#reset=([^:]+):(.+)$/);
  if (rs) { history.replaceState(null, '', location.pathname + location.search); return resetFlow(decodeURIComponent(rs[1]), decodeURIComponent(rs[2])); }
  const c = get(K);
  if (!c || !c.token) {
    await loadLogin();
    return LOGIN.length ? pwForm() : form();
  }
  box.innerHTML = '<div class="spin"></div>';
  try {
    const res = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/dashboard/index.html?ref=${c.branch || 'main'}&t=${Date.now()}`,
      {headers: {Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28'}, cache: 'no-store'});
    if (res.status === 401 || res.status === 403 || res.status === 404) {
      // the saved token no longer works (e.g. it was regenerated): forget it and ask for the password again
      localStorage.removeItem(K); await loadLogin();
      return LOGIN.length ? pwForm('چوونەژوورەوەی پێشوو بەسەرچووە، پاسۆردەکەت بنووسەرەوە.') : form('Token یان username/Repo هەڵەیە، یان Tokenەکە بەسەرچووە (' + res.status + ')');
    }
    if (!res.ok) throw new Error(res.status);
    const html = await res.text();
    try { localStorage.setItem(CACHE, html); } catch {}
    show(html);
  } catch (e) {
    const old = localStorage.getItem(CACHE);
    if (old) show(old); else form('ئینتەرنێت نییە، یان GitHub وەڵام ناداتەوە.');
  }
}
start();
})();
</script>
</body>
</html>
